<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign-up-page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen p-0 m-0 bg-[#e0b0d5]">
<main class="flex flex-col items-center justify-center min-h-screen gap-4 text-3xl">
    <div class="" id="authentication_screen">
    <button id="switch_mode_button" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2 border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Sign-in</button>
    <div class="flex flex-col gap-3 w-full max-w-sm px-4">
    <div class="flex flex-col gap-1 w-full">
        <div id="nickname_block" class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">nickname:</label>
        <span id="nickname_check" class="text-xs text-red-400 hidden">Minimum 3 characters required</span>
        </div>
        <input type="text" id="nickname_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
    </div>
    <div class="flex flex-col gap-1 w-full">
        <div class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">email:</label>
        <span id="email_error" class="text-xs text-red-400 hidden">Use only gmail.com or yandex.ru domens</span>
        </div>
        <input type="text" id="email_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
    </div>
    <div class="flex flex-col gap-1 w-full">
        <div class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">password:</label>
        <span id="security_estimation" class="text-xs text-red-400 hidden">Minimum 4 characters required</span>
        </div>
        <input type="text" id="password_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
        <div class="text-right w-full">
        <button type="button" id="forgot_password_link" class="text-sm rounded-lg font-medium border-2 border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-2 py-1">Restore Password?</button>
        </div>
    </div>
        <div>
        <button type="submit" id="sign-up_main_button" class="block mx-auto bg-[#e7e5e5] text-[#7be0ad] tracking-wider
        rounded-xl border-2 border-[#e7e5e5] active:scale-[0.98] shadow-md cursor-pointer mt-7 py-2 px-10 hover:border-[#7be0ad]
        transition_all disabled:pointer-events-none">Sign-up</button>
        </div>
    </div>
    </div>


    <div class="hidden" id="main_screen">
        <button type="button" id="settings_button" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Settings</button>
    </div>

    <div id="settings_screen" class="hidden flex flex-col items-center justify-center min-h-screen gap-2 text-3xl">

        <label class="text-lg font-medium text-[#aee5d8]">Your nickname: <span id="settings_nickname"
        class="font-bold text-white"></span></label>
        <label class="text-lg font-medium text-[#aee5d8]">Your email: <span id="settings_email"
        class="font-bold text-white"></span></label>
        <button type="button" id="return_to_main_button" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Return</button>
        <button type="button" id="log-out_button" class="mt-3 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Log-out</button>
    </div>

</main>
<script>



    let MainBackground = false;



    const NicknameInput = document.getElementById('nickname_input');
    const EmailInput = document.getElementById('email_input');
    const PasswordInput = document.getElementById('password_input');
    const EmailError = document.getElementById('email_error');
    const SecurityEstimation = document.getElementById('security_estimation');
    const NicknameCheck = document.getElementById('nickname_check');

    const SignUpButton = document.getElementById('sign-up_main_button');
    const SwitchModeBtn = document.getElementById('switch_mode_button');
    const NicknameBlock = document.getElementById('nickname_block');
    let isSignUpMode = true;

    const ForgotPasswordLink = document.getElementById('forgot_password_link');
    const PasswordBlock = PasswordInput.closest('div.flex-col');
    let currentMode = 'sign-up';


    ForgotPasswordLink.addEventListener('click', () => {
    currentMode = 'restore';
    NicknameBlock.classList.add('hidden');
    NicknameInput.classList.add('hidden');
    PasswordBlock.classList.add('hidden');
    ForgotPasswordLink.classList.add('hidden');
    SwitchModeBtn.innerText = 'Sign-in';
    SignUpButton.innerText = 'Send-Code';
    NicknameInput.value = '';
    PasswordInput.value = '';
    SecurityEstimation.classList.add('hidden');
    checkFields();
    });


    SwitchModeBtn.addEventListener('click', () => {
    if (currentMode === 'restore') {
        currentMode = 'sign-in';
    } else if (currentMode === 'sign-up') {
        currentMode = 'sign-in';
    } else {
        currentMode = 'sign-up';
    }

    NicknameInput.value = '';
    EmailInput.value = '';
    PasswordInput.value = '';

    if (currentMode === 'sign-up') {
        NicknameBlock.classList.remove('hidden');
        NicknameInput.classList.remove('hidden');
        PasswordBlock.classList.remove('hidden');
        ForgotPasswordLink.classList.remove('hidden');
        SwitchModeBtn.innerText = 'Sign-in';
        SignUpButton.innerText = 'Sign-up';
    } else if (currentMode === 'sign-in') {
        NicknameBlock.classList.add('hidden');
        NicknameInput.classList.add('hidden');
        PasswordBlock.classList.remove('hidden');
        ForgotPasswordLink.classList.remove('hidden');
        SwitchModeBtn.innerText = 'Sign-up';
        SignUpButton.innerText = 'Sign-in';
    }
    checkFields();
});

    const dependentButton = [
    document.getElementById('sign-up_main_button'),
    ];

    function checkFields() {
        const emailRegex = /^[\w\-.]+@(?:gmail\.com|yandex\.ru)$/;
        const currentEmailValue = EmailInput.value.trim();
        const currentNicknameValue = NicknameInput.value.trim();
        const isPasswordFilled = PasswordInput.value.trim() !== '';
        const isEmailValid = emailRegex.test(EmailInput.value.trim());

        if (currentEmailValue !== '' && !isEmailValid) {
            EmailError.classList.remove('hidden');
        } else {
            EmailError.classList.add('hidden');
        }

        let isNicknameValid = false;
        const nicknameLength = currentNicknameValue.length;
        if (nicknameLength < 3) {
            NicknameCheck.classList.remove('hidden');
        } else {
            NicknameCheck.classList.add('hidden')};
            isNicknameLength = true;

        const currentPasswordValue = PasswordInput.value;
        const hasLetters = /[a-zA-Z]/.test(currentPasswordValue);
        const hasDigits = /[0-9]/.test(currentPasswordValue);
        const passwordLength = currentPasswordValue.length;

        let isPasswordValid = false;
        SecurityEstimation.classList.remove('text-red-400','text-orange-400','text-green-400');
        if (passwordLength === 0) {
            SecurityEstimation.classList.add('hidden');
        } else {
            SecurityEstimation.classList.remove('hidden');
            if (passwordLength < 4) {
                SecurityEstimation.innerText = 'Minimum 4 characters required';
                SecurityEstimation.classList.add('text-red-400');
            }
            else if (passwordLength >= 4 && passwordLength < 6) {
                SecurityEstimation.innerText = 'Weak Password';
                SecurityEstimation.classList.add('text-red-400');

            }
            else if (passwordLength >= 6 && passwordLength < 8) {
                if (hasLetters && hasDigits) {
                    SecurityEstimation.innerText = 'Medium Password';
                    SecurityEstimation.classList.add('text-orange-400');
                    isPasswordValid = true;
                } else {
                    SecurityEstimation.innerText = 'Weak Password';
                    SecurityEstimation.classList.add('text-red-400');
                }
            }
            else if (passwordLength >= 8) {
                if (hasLetters && hasDigits) {
                    SecurityEstimation.innerText = 'Excellent Password';
                    SecurityEstimation.classList.add('text-green-400');
                    isPasswordValid = true;
                } else {
                    SecurityEstimation.innerText = 'Medium Password';
                    SecurityEstimation.classList.add('text-orange-400');
                    isPasswordValid = true;
                }
        }
        }
    dependentButton.forEach(button => {
        if (currentMode === 'sign-up') {
        button.disabled = !(nicknameLength >= 3 && isEmailValid && isPasswordValid);
        } else if (currentMode === 'sign-in') {
        button.disabled = !(isEmailValid && isPasswordValid);
        } else if (currentMode === 'restore') {
        button.disabled = !(isEmailValid);
        }
    });
    }

    NicknameInput.addEventListener('input',checkFields);
    EmailInput.addEventListener('input',checkFields);
    PasswordInput.addEventListener('input',checkFields);

    checkFields();

    function showMainMenu() {
    if (MainBackground && isSettingsOn) {
        document.getElementById('authentication_screen').classList.add('hidden');
        document.getElementById('main_screen').classList.add('hidden');
        document.getElementById('settings_screen').classList.remove('hidden');
    } else if (isSettingsOn && !MainBackground) {
        document.getElementById('authentication_screen').classList.add('hidden');
        document.getElementById('main_screen').classList.add('hidden');
        document.getElementById('settings_screen').classList.remove('hidden');
    } else if (MainBackground) {
        document.getElementById('authentication_screen').classList.add('hidden');
        document.getElementById('settings_screen').classList.add('hidden');
        document.getElementById('main_screen').classList.remove('hidden');
    }
    else {
        document.getElementById('authentication_screen').classList.remove('hidden');
        document.getElementById('settings_screen').classList.add('hidden');
        document.getElementById('main_screen').classList.add('hidden');
    }
    };

    //part of code of log-out and settings:
    isSettingsOn = false;
    const SettingsBtn = document.getElementById('settings_button');
    SettingsBtn.addEventListener('click', () => {
    isSettingsOn = true;
    showMainMenu();
    });

    const LogOutBtn = document.getElementById('log-out_button');
    LogOutBtn.addEventListener('click', () => {
    MainBackground = false;
    isSettingsOn = false;
    showMainMenu();
    });

    const ReturnToMainBtn = document.getElementById('return_to_main_button');
    ReturnToMainBtn.addEventListener('click', () => {
    MainBackground = true;
    isSettingsOn = false;
    showMainMenu();
    });

    SignUpButton.addEventListener('click',() => {
    if (currentMode === 'sign-up') {
    fetch('http://127.0.0.1:8080/password_page/create_password', {
        method: 'POST',
        headers: {
        'Content-Type' : 'application/json'
        },
        body: JSON.stringify({
            nickname: NicknameInput.value.trim(),
            email: EmailInput.value.trim(),
            password: PasswordInput.value
        })
    })
    .then(res => res.json())
    .then(data => {console.log(data)
    if (data.status_code === 200) {
        alert(data.comment);
        document.getElementById('settings_nickname').innerText = NicknameInput.value.trim();
        document.getElementById('settings_email').innerText = EmailInput.value.trim();
        MainBackground = true;
        showMainMenu();
    }})
    .catch(err => console.error(err));
    } else if (currentMode === 'sign-in') {
    fetch('http://127.0.0.1:8080/password_page/sign-in', {
        method: 'POST',
        headers: {
            'Content-Type' : 'application/json'
        },
        body: JSON.stringify({
            email: EmailInput.value.trim(),
            password: PasswordInput.value
        })
    })
    .then(res => res.json())
    .then(data => {console.log(data);
    if (data.status_code === 200) {
        alert("Hello! " + data.nickname);
        document.getElementById('settings_nickname').innerText = data.nickname;
        document.getElementById('settings_email').innerText = EmailInput.value.trim();
        MainBackground = true;
        showMainMenu();
    } else {
        alert("Error" + (data.detail || "wrong data!"));
    }
    })
    .catch(err => console.error(err));
    } else if (currentMode === 'restore') {
    fetch('http://127.0.0.1:8080/password_page/forgot_password', {
        method: 'POST',
        headers: {
            'Content-Type' : 'application/json'
        },
        body: JSON.stringify({
            email: EmailInput.value.trim()
        })
    })
    .then(res => {
        if (!res.ok) {
            return res.json().then(errData => {
                throw new Error(errData.detail || "Unknown server error");
            });
    }
    return res.json();
    })
    .then(data => {
        console.log(data);
        alert("Code has been sent to email!");
    })
    .catch(err => {
        console.error(err);
        alert("Error: " + err.message);
    });
    }
    });

</script>
</body>
</html>
