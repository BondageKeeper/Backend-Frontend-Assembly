<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign-up-page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen p-0 m-0 bg-[#e0b0d5]">
<main class="flex flex-col items-center justify-center min-h-screen gap-4 text-3xl">
    <div class="" id="authentication_screen">
    <button id="switch_mode_button" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2 border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Sign-in</button>
    <div class="flex flex-col gap-3 w-full max-w-sm px-4">
    <div class="flex flex-col gap-1 w-full">
        <div id="nickname_block" class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">nickname:</label>
        <span id="nickname_check" class="text-xs text-red-400 hidden">Minimum 3 characters required</span>
        </div>
        <input type="text" id="nickname_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
    </div>
    <div class="flex flex-col gap-1 w-full">
        <div class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">email:</label>
        <span id="email_error" class="text-xs text-red-400 hidden">Use only gmail.com or yandex.ru domens</span>
        </div>
        <input type="text" id="email_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
    </div>
    <div class="flex flex-col gap-1 w-full">
        <div class="flex justify-between items-baseline">
        <label class="text-lg font-medium text-[#aee5d8]">password:</label>
        <span id="security_estimation" class="text-xs text-red-400 hidden">Minimum 4 characters required</span>
        </div>
        <input type="text" id="password_input" class="rounded-lg bg-transparent text-[#e7e5e5] border-3
        border-[#e7e5e5] focus:outline-none focus:border-[#7be0ad] transition-colors">
        <div class="text-right w-full">
        <button type="button" id="forgot_password_link" class="text-sm rounded-lg font-medium border-2 border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-2 py-1">Restore Password?</button>
        </div>
    </div>
        <div>
        <button type="submit" id="sign-up_main_button" class="block mx-auto bg-[#e7e5e5] text-[#7be0ad] tracking-wider
        rounded-xl border-2 border-[#e7e5e5] active:scale-[0.98] shadow-md cursor-pointer mt-7 py-2 px-10 hover:border-[#7be0ad]
        transition_all disabled:pointer-events-none">Sign-up</button>
        </div>
    </div>
    </div>

    <div class="hidden" id="main_screen">
    <div class="absolute top-5 right-5 flex flex-col items-center gap-3 ">
    <button type="button" id="dashboard_button" class="text-sm rounded-lg font-medium border-2
    border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Dashboard</button>
        <button type="button" id="settings_button" class="text-sm rounded-lg font-medium border-2
    border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Settings</button>
    </div>

    <div class="w-screen max-w-2xl mx-auto mt-32 flex flex-col items-stretch backdrop-blur-md bg-white/5 rounded-2xl shadow-xl border border-white/20 p-6 gap-5">
        <div class="">
            <label class="block text-xs font-semibold text-[#7be0ad] tracking-wider mb-2">What's the topic/question?</label>
            <textarea id="ai_request_input" rows="10" placeholder="Write a plan to prepare for IELTS..."
                      class="w-full px-4 py-3 bg-[#e7e5e5]/10 border border-[#e7e5e5]/20 focus:border-[#7be0ad]
                      rounded-xl text-[#e7e5e5] placeholder-[#e7e5e5]/80 focus:outline-none transition-all resize-none
                      text-sm"></textarea>
        </div>
        <div class="flex items-end gap-3">
            <div class="w-20 shrink-0">
                <label class="block text-xs font-semibold text-[#7be0ad] tracking-wider ">Steps</label>
                <input type="number" id="ai_steps_part" min="1" max="5" value="3"
                       class="w-full px-2 py-2.5 bg-[#e7e5e5] border border-[#e7e5e5]/20 focus:border-[#7be0ad] rounded-xl
                       text-[#7be0ad] text-center focus:outline-none transition-all text-sm font-bold">
            </div>
            <div class="flex gap-2 flex-1">
                <button type="button" id="generate_plan_btn" class="border-2 border-transparent
                flex-1 text-sm rounded-xl font-bold active:scale-[0.98]
                shadow-md text-[#e7e5e5] bg-[#7be0ad] cursor-pointer hover:border-[#e7e5e5] transition-all cursor-pointer py-2.5
                disabled:pointer-events-none opacity-75" disabled>Generate</button>
                <button type="button" id="clean_plan_btn" class="bg-[#e7e5e5] text-sm rounded-xl font-medium border-2
                active:scale-[0.98] border-transparent
                text-[#7be0ad] hover:border-[#7be0ad] transition-all cursor-pointer px-4 py-2.5">Clean</button>
            </div>
        </div>
    </div>
    </div>


    <div id="dashboard_screen" class="hidden w-full min-h-screen px-6 py-8 flex flex-col gap-6">

    <div class="absolute top-5 left-5 flex flex-col items-center gap-3">
    <button type="button" id="save_cards_btn" class="text-sm rounded-lg font-medium border-2
    border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Save</button>
        <button type="button" id="delete_cards_btn" class="text-sm rounded-lg font-medium border-2
    border-[#e7e5e5] active:scale-[0.98]
    shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Delete</button>
    </div>

    <button type='button' id="return_to_main_button2" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Return</button>
    <div class="w-full max-w-6xl mx-auto mt-12 grid grid-cols-1 md:grid-cols-3 gap-6 px-4 pb-20">





    <!--AI plan -->
    <div class="bg-white/5 border border-[#7be0ad]/10 rounded-2xl p-4 flex flex-col min-h-[70vh]">
        <div class="flex justify-between items-center mb-4 border-b border-[#7be0ad]/10 pb-2">
            <h3 class="font-bold text-[#7be0ad] text-sm tracking-wider uppercase">Plan</h3>
            <span id="todo_counter" class="bg-[#7be0ad]/20 text-[#7be0ad] text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <!--For cards-->
        <div id="todo_column" class="flex-grow flex flex-col gap-3 p-1 rounded-xl transition-all"></div>
    </div>

    <!--In process-->
    <div class="bg-white/5 border border-[#7be0ad]/10 rounded-2xl p-4 flex flex-col min-h-[70vh]">
        <div class="flex justify-between items-center mb-4 border-b border-[#7be0ad]/10 pb-2">
            <h3 class="font-bold text-[#7be0ad] text-sm tracking-wider uppercase">In Progress</h3>
            <span id="progress_counter" class="bg-[#7be0ad]/20 text-[#7be0ad] text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <!--For cards-->
        <div id="progress_column" class="flex-grow flex flex-col gap-3 p-1 rounded-xl transition-all"></div>
    </div>

    <!-- what is done: -->
    <div class="bg-white/5 border border-[#7be0ad]/10 rounded-2xl p-4 flex flex-col min-h-[70vh]">
        <div class="flex justify-between items-center mb-4 border-b border-[#7be0ad]/10 pb-2">
            <h3 class="font-bold text-emerald-300 text-sm tracking-wider uppercase">Done</h3>
            <span id="done_counter" class="bg-emerald-300/20 text-emerald-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <!--For cards-->
        <div id="done_column" class="flex-grow flex flex-col gap-3 p-1 rounded-xl transition-all"></div>
    </div>
    </div>
    </div>







    <div id="settings_screen" class="hidden flex flex-col items-center justify-center min-h-screen gap-2 text-3xl">
        <label class="text-lg font-medium text-[#aee5d8]">Your nickname: <span id="settings_nickname"
        class="font-bold text-white"></span></label>
        <label class="text-lg font-medium text-[#aee5d8]">Your email: <span id="settings_email"
        class="font-bold text-white"></span></label>
        <button type="button" id="return_to_main_button" class="absolute top-5 right-5 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer w-30 px-5 py-2">Return</button>
        <button type="button" id="log-out_button" class="mt-3 text-sm rounded-lg font-medium border-2
        border-[#e7e5e5] active:scale-[0.98]
        shadow-md text-[#7be0ad] bg-[#e7e5e5] hover:border-[#7be0ad] transition-all cursor-pointer px-5 py-2">Log-out</button>
    </div>


</main>
<script>
