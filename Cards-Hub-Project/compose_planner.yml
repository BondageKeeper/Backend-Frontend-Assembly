version: '3.8'

services:
  db_postgres:
    image: postgres:15-alpine
    container_name: cards-hub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '[WRITE HERE A PASSWORD OF YOU DATABASE]'
      POSTGRES_DB: [WRITE HERE A SERVER OF YOU WEBSITE]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d [WRITE HERE A SERVER OF YOU WEBSITE]"]
      interval: 5s
      timeout: 5s
      retries: 5

  web_app:
    build: .
    container_name: cards-hub
    ports:
      - "80:8080"
      - "443:8080"
    depends_on:
      db_postgres:
        condition: service_healthy
